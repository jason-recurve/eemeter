[project]
name = "eemeter"
description = "Open Demand-Side Measurement"
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "PyWavelets",
    "attrs",
    "click",
    "fdasrsf>=2.4.1",
    "nlopt",
    "numba",
    "numpy>=1.24.4",
    "pandas>=1.1.0",
    "pyarrow",
    "pydantic>=2.0",
    "requests",
    "scikit-fda",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.1",
    "statsmodels",
]
authors = [
    {name = "Phil Ngo", email = "admin@openee.io"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = {text = "Apache 2.0"}

[project.urls]
Homepage = "http://github.com/opendsm/opendsm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "opendsm/__version__.py"
